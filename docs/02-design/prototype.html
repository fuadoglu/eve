r-radius:9px;border:1px solid var(--line);font-size:14px;background:#fff}.day.available{background:#edf8f3;border-color:#adcdbf;color:#145540}.day.unavailable{background:#f1f3f3;color:#657473;border-color:transparent;cursor:default}.day.selected{background:var(--primary);color:#fff;border-color:var(--primary)}.day.private-filled{background:#fff3d6;border-color:#ecd5a6;color:#704b00}.calendar-wrap{max-width:500px}.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.tabs button{font-size:13px;padding:9px 12px;min-height:44px;background:#edf3f2}.tabs button.active{background:var(--primary);color:#fff}.room-list{margin:10px 0;padding:0;list-style:none}.room-list li{padding:7px 0;border-bottom:1px solid #edf1ef;display:flex;justify-content:space-between;gap:15px}.room-list li:last-child{border-bottom:0}.room-status{font-size:12px;color:var(--primary);font-weight:700}.room .actions button{font-size:14px;padding:10px}.room.selected-ok{border-color:#75b596;background:#fbfffc}.room.selected-problem{border-color:#d6ae65}.room .problem-fields{margin-top:14px;padding-top:4px;border-top:1px solid var(--line)}.check-row{display:flex;align-items:flex-start;gap:10px;margin:10px 0;font-weight:450}.check-row input{width:20px;min-height:20px;margin-top:3px;accent-color:var(--primary);flex:none}.bottom-nav{display:none}.fab{position:fixed;right:max(24px,calc((100vw - 1080px)/2));bottom:26px;width:56px;height:56px;padding:0;background:var(--primary);color:#fff;border-radius:18px;box-shadow:0 7px 22px #0f766e40;font-size:28px;z-index:20}.back{padding:8px 0;min-height:44px;color:var(--primary);font-size:14px}.state{padding:36px 24px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px}.state .icon{margin:0 auto 14px}.skeleton{height:90px;border-radius:14px;background:linear-gradient(90deg,#e8eeeb,#f5f8f6,#e8eeeb);background-size:200% 100%;animation:pulse 1.5s infinite;margin-bottom:12px}.loader{width:24px;height:24px;border:3px solid #d2e6df;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}.auth{max-width:410px;margin:36px auto}.auth .brand{justify-content:center;margin-bottom:28px;font-size:40px}.auth h1{font-size:28px}.auth .card{padding:26px}.guide-step{display:flex;gap:12px;margin:18px 0}.step-num{width:30px;height:30px;background:var(--soft);color:var(--primary);font-weight:750;border-radius:50%;display:grid;place-items:center;flex:none}.video-placeholder{height:170px;border-radius:12px;background:#e4ece7;display:grid;place-items:center;text-align:center;padding:16px}.video-placeholder button{background:#fff}.price{font-size:25px;font-weight:750}.price small{font-size:13px;font-weight:450;color:var(--muted)}.lang{display:flex;gap:6px}.lang button{min-width:44px;min-height:44px;padding:7px 10px;border:1px solid var(--line);background:#fff}.lang button.active{background:var(--primary);color:#fff}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#102a2b;color:#fff;box-shadow:var(--shadow);padding:12px 16px;border-radius:12px;width:min(90vw,480px);z-index:100;font-size:14px}.hidden{display:none!important}dialog{border:0;border-radius:20px;padding:0;max-width:520px;width:calc(100% - 32px);max-height:90dvh;box-shadow:0 25px 80px #102a2b40}dialog::backdrop{background:#102a2b70}.dialog-body{padding:22px;overflow:auto;max-height:85dvh}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.close{min-width:44px;padding:8px;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid>div{min-width:0}.form-actions{position:sticky;bottom:0;background:#fff;padding:16px 0 0;display:flex;gap:10px}.form-actions>*{flex:1}details{margin:16px 0}summary{cursor:pointer;color:var(--primary);padding:10px 0;min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.only-mobile{display:none}.subtle-link{padding:8px 0;color:var(--primary);font-size:14px}.badge-number{width:24px;height:24px;border-radius:50%;background:#e8efed;font-size:12px;display:grid;place-items:center}.inspector-top{border-left:4px solid var(--primary)}@keyframes pulse{to{background-position:-200% 0}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
    .shell.guest{grid-template-columns:1fr;max-width:760px}.guest .sidebar{display:none}.guest .topbar .brand{display:flex}.guest .topbar .avatar,.guest .desktop-date{display:none}
    @media(max-width:767px){.demo{padding:8px 14px;justify-content:flex-start;gap:4px}.demo span{font-size:11px}.lab{padding:10px 16px;gap:8px}.lab>div{min-width:120px}.shell{display:block}.sidebar{display:none}.workspace{padding:18px 16px calc(110px + env(safe-area-inset-bottom));min-height:75dvh}.topbar{margin-bottom:22px}.topbar .brand{display:flex}.topbar .desktop-date{display:none}.page-head{margin-bottom:20px}h1{font-size:28px}.grid2{grid-template-columns:1fr}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:22px}.card{padding:16px}.bottom-nav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid var(--line);backdrop-filter:blur(12px);z-index:30}.bottom-nav button{font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:1px;min-height:50px;padding:5px}.bottom-nav .nav-symbol{font-size:20px;line-height:1.1}.bottom-nav button[aria-current="page"]{color:var(--primary);background:var(--soft)}.fab{right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:17px}.only-mobile{display:block}.auth{margin:12px auto}.dialog-body{padding:18px}.form-grid{grid-template-columns:1fr}.form-actions{padding-bottom:env(safe-area-inset-bottom)}.toast{bottom:155px}.price{font-size:23px}.amounts strong{font-size:17px}.amounts div{padding:10px}.state{padding:28px 18px}.page-head .actions{margin-top:12px}}

<body>
  <div class="demo"><strong>UX DEMO</strong><span>Saxta nümunə məlumatları · Backend yoxdur · Heç bir ödəniş və göndəriş edilmir</span></div>
  <div class="lab" aria-label="Prototip idarəetməsi">
    <div><label for="screen-picker">Ekrana keç</label><select id="screen-picker" aria-label="Ekran seç"></select></div>
    <div><label for="state-picker">Vəziyyəti göstər</label><select id="state-picker"><option value="normal">Normal</option><option value="empty">Boş</option><option value="loading">Yüklənir</option><option value="error">Xəta</option><option value="noaccess">İcazə yoxdur</option><option value="offline">Bağlantı yoxdur</option></select></div>
    <button class="ghost small" id="reset-demo">Demonu sıfırla</button>
  </div>
  <div class="shell">
    <aside class="sidebar"><div class="brand"><span class="brand-mark" aria-hidden="true">e</span>eve</div><p class="small muted" style="margin-top:8px">Evlərin bir yerdə.</p><nav aria-label="Əsas naviqasiya" class="desktop-nav"></nav><div class="divider"></div><button class="nav-item full" data-go="settings">⚙ <span>Ayarlar</span></button><p class="small muted" style="margin-top:30px">Nümunə hesab<br>Rizvan · sahib və menecer</p></aside>
    <div class="workspace"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">e</span>eve</div><span class="desktop-date small muted">10 noyabr 2026 · Bakı</span><button class="avatar" data-go="settings" aria-label="Hesab və ayarlar">RM</button></header><main id="main" tabindex="-1"></main></div>
  </div>
  <button class="fab" id="add-button" aria-label="Əlavə et">+</button>
  <nav class="bottom-nav" aria-label="Əsas mobil naviqasiya"></nav>
  <dialog id="sheet"><div class="dialog-body" id="sheet-body"></div></dialog>
  <div id="announcement" class="hidden toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    const screens = [['today','UI04 · Bu gün'],['calendar','UI05 · Təqvim'],['properties','UI06 · Mənzillər'],['property','UI07 · Mənzil'],['reservation','UI08 · Rezervasiya'],['task','UI09 · Tapşırıq'],['inventory','UI10 · İnventar'],['inspection','UI11 · Evi yoxla'],['worker','UI12 · İşçinin tapşırığı'],['editor','UI13 · Təlimat redaktoru'],['public','UI14 · Public mənzil'],['guide','UI15 · Sauna təlimatı'],['managers','UI16 · Menecerlər'],['billing','UI17 · Abunə'],['settings','UI18 · Ayarlar'],['operator','UI19 · Operator'],['login','UI01 · Email girişi'],['checkemail','UI02 · Emaili yoxla'],['confirm','UI03 · Girişi təsdiqlə']];
    const navs = [['today','◷','Bu gün'],['calendar','▦','Təqvim'],['properties','⌂','Mənzillər']];
    let page='today', viewState='normal', lang='az', publicDates=[], email='', answers={}, inspectionDone=false, received=100, extraNotice='', inspectorName='Səbinə', bookingState='confirmed', taskState='open';
    const rooms=[{id:'living',name:'Qonaq otağı',items:[['Televizor','1 ədəd'],['Pult','1 ədəd'],['Divan','1 ədəd']]},{id:'kitchen',name:'Mətbəx',items:[['Stəkan','6 ədəd'],['Boşqab','6 ədəd'],['Çaydan','1 ədəd']]},{id:'bed',name:'Yataq otağı',items:[['Yastıq','4 ədəd'],['Yorğan','2 ədəd'],['Yataq dəsti','2 dəst']]},{id:'bath',name:'Hamam',items:[['Fen','1 ədəd'],['Dəsmal','4 ədəd']]}];
    const $=s=>document.querySelector(s);
    const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const art=(blue=false)=>`<div class="property-art ${blue?'blue':''}" aria-label="Mənzilin nümunə illüstrasiyası"><div class="building" aria-hidden="true">${'<i></i>'.repeat(6)}</div></div>`;
    const head=(label,title,sub='')=>`<div class="page-head"><div class="eyebrow">${label}</div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>`;
    const notice=txt=>`<div class="notice small">${txt}</div>`;
    const btn=(text,go,cl='secondary')=>`<button class="${cl}" data-go="${go}">${text}</button>`;
    function announce(text){$('#announcement').textContent=text;$('#announcement').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#announcement').classList.add('hidden'),6500)}
    function go(to){page=to;viewState='normal';$('#state-picker').value='normal';extraNotice='';render();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true})}
    function renderNav(){const active=['today','calendar'].includes(page)?page:'properties';for(const sel of ['.desktop-nav','.bottom-nav'])$(sel).innerHTML=navs.map(([id,icon,label])=>`<button class="${sel==='.desktop-nav'?'nav-item':''}" data-go="${id}" ${id===active?'aria-current="page"':''}><span class="nav-symbol" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('')}
    function statePanel(){if(viewState==='normal'||viewState==='offline')return '';if(viewState==='loading')return `<div role="status" aria-label="Nümunə yüklənmə vəziyyəti"><div class="skeleton"></div><div class="skeleton"></div><p class="small muted">Yüklənmə nümunəsi. Real sorğu getmir.</p></div>`;const types={empty:['⌂','Hələ məlumat yoxdur','İlk qeydi əlavə etdikdə burada görünəcək.','Nümunə əlavə et'],error:['!','Məlumatı aça bilmədik','Daxil etdiyiniz məlumatı saxlayırıq. Yenidən yoxlaya bilərsiniz.','Yenidən yoxla'],noaccess:['⊘','Bu bölməyə girişiniz yoxdur','Səlahiyyət yalnız sizə həvalə edilmiş evlər üzrə verilir.','Mənzillərə qayıt']};const [i,t,d,b]=types[viewState];return `<section class="state"><div class="icon" aria-hidden="true">${i}</div><h2>${t}</h2><p class="muted" style="margin:10px 0 20px">${d}</p><button class="primary" data-action="restore">${b}</button></section>`}
    function today(){return head('Çərşənbə axşamı, 10 noyabr','Bu gün','Nə etməli olduğunuz bir yerdə.')+`<div class="metrics"><div class="metric"><strong>2</strong><span>Giriş / çıxış</span></div><div class="metric"><strong>1</strong><span>Görüləcək iş</span></div><div class="metric"><strong>200 ₼</strong><span>Alınacaq pul</span></div></div><div class="section-title"><h2>Günün planı</h2><span class="small muted">Bakı vaxtı</span></div><div class="stack"><article class="card"><div class="row"><div class="date-stamp">Giriş<strong>15:00</strong></div><div class="grow"><h3>Ağ Şəhər · 2 otaq</h3><p class="small muted">Rauf · 10–13 noyabr · 3 gecə</p></div><span class="pill">Hazırdır</span></div><div class="actions">${btn('Rezervasiyaya bax','reservation','primary')}${btn('Təlimat','guide','ghost')}</div></article><article class="card"><div class="row"><div class="date-stamp">Çıxış<strong>12:00</strong></div><div class="grow"><h3>Nizami · studio</h3><p class="small muted">Sahib: Nigar · siz menecersiniz</p></div></div><div class="divider"></div><div class="row between"><span class="small">Təmizlik · 13:00</span><span class="pill amber">Qəbul gözləyir</span></div><div class="actions">${btn('Tapşırığa bax','task')}${btn('Evi yoxla','inspection','ghost')}</div></article></div><div class="section-title"><h2>Pul xatırlatması</h2></div><article class="card row"><div class="icon" aria-hidden="true">₼</div><div class="grow"><h3>200 AZN qalıq</h3><p class="small muted">Ağ Şəhər · Rauf</p></div><button class="ghost" data-form="money">Pul al</button></article>`}
    function calendar(publicView=false){const available=[11,12,13,16,17,18,19,23,24,25,26,27,28];return `<div class="calendar-wrap"><div class="row between" style="margin-bottom:14px"><h3>Noyabr 2026</h3><span class="small muted">${publicView?'Yalnız uyğun tarixlər':'Ağ Şəhər'}</span></div><div class="calendar">${['B.e','Ç.a','Ç','C.a','C','Ş','B'].map(d=>`<span class="weekday">${d}</span>`).join('')}${Array.from({length:30},(_,i)=>{let d=i+1;let ok=available.includes(d);let departure=publicView&&publicDates.length===1&&d>publicDates[0]&&Array.from({length:d-publicDates[0]},(_,i)=>publicDates[0]+i).every(n=>available.includes(n));return `<button class="day ${publicView?(ok?'available':'unavailable'):(ok?'available':'private-filled')} ${publicDates.includes(d)&&publicView?'selected':''}" ${publicView&&!ok&&!departure?'disabled':''} data-day="${d}" data-public="${publicView}" aria-label="${d} noyabr${publicView?(ok?', uyğun tarix':', seçilə bilmir'):(ok?', boş':', əlçatan deyil')}">${d}</button>`}).join('')}</div></div>`}
    function calendarPage(){return head('Bütün evlər','Təqvim','Tarixə toxunun, yeni rezervasiya yaradın.')+`<div class="row wrap" style="margin-bottom:18px"><select name="calendar-property" aria-label="Ev seç" style="flex:1;min-width:180px"><option>Ağ Şəhər · sahib: siz</option><option>Nizami · sahib: Nigar</option></select><button class="ghost" data-action="agenda">Günün planı</button></div><section class="card">${calendar()}<p class="help" style="margin-top:14px">Nümunə daxili təqvim · eyni gün çıxış və yeni giriş mümkündür.</p></section><div class="section-title"><h2>Yaxın tarixlər</h2></div><article class="card row"><div class="date-stamp">Noy<strong>10–13</strong></div><div class="grow"><h3>Rauf · 3 gecə</h3><p class="small muted">300 AZN · 100 AZN alınıb</p></div><button class="ghost" data-go="reservation">Bax</button></article>`}
    function properties(){return head('Sizə aid və həvalə edilmiş','Mənzillər','Bir hesabdan bütün evlərinizi idarə edin.')+`<div class="row" style="margin-bottom:18px"><select name="owner-filter" aria-label="Sahibə görə süzgəc"><option>Bütün sahiblər</option>Mənim evlərim</option>Nigarın evləri</option></select></div><div class="grid2"><article class="card">${art()}<div class="row between"><h2 class="property-name">Ağ Şəhər · 2 otaq</h2><span class="pill">Hazırdır</span></div><p class="small muted">Sahib: siz · 4 qonaq</p><div class="actions">${btn('Evi aç','property','primary')}${btn('Public görünüş','public','ghost')}</div></article><article class="card">${art(true)}<div class="row between"><h2 class="property-name">Nizami · studio</h2><span class="pill amber">Təmizlik</span></div><p class="small muted">Sahib: Nigar · tam idarəetmə</p><div class="actions">${btn('Evi aç','property','primary')}${btn('Tapşırıq','task','ghost')}</div></article></div>`}
    function property(){return `<button class="back" data-go="properties">← Mənzillər</button>`+head('Sahib: siz','Ağ Şəhər','2 otaq · 4 qonaq · giriş 15:00 / çıxış 12:00')+`<div class="tabs">${[['Təqvim','calendar'],['Pul','reservation'],['İnventar','inventory'],['Təlimatlar','editor']].map(([t,p])=>btn(t,p)).join('')}</div><div class="card">${art()}<div class="row between" style="margin-top:16px"><div><span class="pill">Hazırdır</span><p class="help">Növbəti giriş: bu gün, 15:00</p></div><button class="ghost" data-go="inspection">Evi yoxla</button></div></div><div class="section-title"><h2>Tez keçidlər</h2></div><div class="card"><button class="list-btn" data-go="public"><span>Public təqdimata bax</span><span aria-hidden="true">↗</span></button><button class="list-btn" data-go="guide"><span>Sauna · QR təlimatı</span><span aria-hidden="true">↗</span></button><button class="list-btn" data-go="managers"><span>Menecerlər</span><span class="badge-number">1</span></button><button class="list-btn" data-go="billing"><span>Abunə · 10 dekabradək</span><span aria-hidden="true">›</span></button></div>`}
    function reservation(){return `<button class="back" data-go="today">← Bu gün</button>`+head('Ağ Şəhər · '+({confirmed:'təsdiqlənib',checked_in:'qonaq daxil olub',completed:'tamamlanıb'}[bookingState]),'Raufun rezervasiyası','10–13 noyabr · 3 gecə')+`<div class="card"><div class="row between"><h2>Ödəniş qeydləri</h2><span class="pill gray">Uçot</span></div><div class="amounts"><div><span>Ümumi</span><strong>300 ₼</strong></div><div><span>Alınıb</span><strong>${received} ₼</strong></div><div><span>Qalıb</span><strong>${Math.max(0,300-received)} ₼</strong></div></div><div class="actions"><button class="primary" data-form="money">Pul al</button><button class="ghost" data-form="refund">Pul qaytar</button></div><p class="help">Eve kirayə pulunu qəbul etmir. Burada yalnız qeydə alırsınız.</p></div><div class="card" style="margin-top:14px"><h2>Giriş məlumatları</h2><p class="muted small" style="margin-top:8px">Giriş 15:00 · çıxış 12:00</p><div class="actions"><button class="primary" data-action="checkin" ${bookingState==='completed'?'disabled':''}>${bookingState==='confirmed'?'Giriş etdi':bookingState==='checked_in'?'Çıxış etdi':'Tamamlandı'}</button><button class="ghost" data-action="guest-share">Təlimatı paylaş</button></div></div><div class="card" style="margin-top:14px"><button class="list-btn" data-form="reservation"><span>Tarixləri və məlumatı dəyiş</span><span>›</span></button><button class="list-btn" data-form="cancel"><span class="danger">Rezervasiyanı ləğv et</span><span>›</span></button></div>`}
    function task(worker=false){return head(worker?'Qeydiyyatsız tapşırıq keçidi':'Nizami · studio','Evin təmizliyi','10 noyabr · saat 13:00')+`<div class="card"><div class="row"><div class="icon" aria-hidden="true">✓</div><div><h2>Çıxışdan sonra təmizlik</h2><p class="small muted">İcraçı: Səbinə (nümunə)</p><span class="pill gray">${({open:'Qəbul gözləyir',accepted:'Qəbul edilib',reported_done:'Təsdiq gözləyir',completed:'Tamamlanıb'})[taskState]} · demo</span></div></div><div class="divider"></div><p>Dəsmalları dəyişin, hamamı və mətbəxi təmizləyin. Sonda otaqlar üzrə yoxlamanı tamamlayın.</p><p class="help">Yalnız bu işə aid məlumat göstərilir.</p><div class="actions">${worker?`<button class="primary" data-action="accept-task" ${taskState!=='open'?'disabled':''}>${taskState==='open'?'Qəbul etdim':'Qəbul edilib'}</button><button class="ghost" data-go="inspection">Yoxlamaya keç</button>`:'<button class="primary" data-action="whatsapp">WhatsApp-da paylaş</button><button class="ghost" data-go="worker">İşçinin görünüşü</button>'}</div></div><div class="card" style="margin-top:14px"><h2>İşin nəticəsi</h2><p class="small muted" style="margin-top:8px">İcraçı tamamladığını bildirdikdən sonra sahib və ya menecer təsdiqləyir.</p><div class="actions"><button class="secondary" data-action="report-task" ${(worker?taskState!=='accepted':taskState!=='reported_done')?'disabled':''}>${worker?'Tamamladım':'Nəticəni təsdiqlə'}</button><button class="ghost" data-form="expense">${worker?'Xərc təqdim et':'Xərc əlavə et'}</button></div></div>`}
    function inventory(){return `<button class="back" data-go="property">← Ağ Şəhər</button>`+head('Daimi əşya siyahısı','İnventar','Siyahını bir dəfə hazırlayın, təhvildə yalnız yoxlayın.')+`<div class="actions" style="margin-bottom:20px"><button class="primary" data-action="template">Standart siyahı</button><button class="ghost" data-action="copy-inventory">Başqa evdən kopyala</button></div><div class="stack">${rooms.map(r=>`<section class="card"><h2>${r.name}</h2><ul class="room-list">${r.items.map(([n,q])=>`<li><span>${n}</span><span class="muted">${q}</span></li>`).join('')}</ul></section>`).join('')}</div><div class="actions"><button class="primary" data-go="inspection">Təhvil yoxlamasını aç</button></div>`}
    function inspection(){if(inspectionDone)return head('Təhvil yoxlaması','Yoxlama tamamlandı','Nümunə nəticə · 10 noyabr 2026')+notice('DEMO: nəticə yalnız bu açıq səhifənin yaddaşındadır. Serverə və heç bir şəxsə göndərilməyib.')+`<div class="card" style="margin-top:16px"><h2>Ağ Şəhər · təhvil alan</h2><p style="margin-top:10px">${rooms.length} otaq yoxlanıldı · ${Object.values(answers).filter(a=>a.type!=='ok').length} diqqət tələb edən qeyd</p><p class="help">Bu nümunə cavab kilidləndi. Digər tərəfin cavabı ayrıca saxlanmalıdır.</p><button class="ghost" data-action="restart-inspection">Demonu yenidən yoxla</button></div>`;return head('10 noyabr · təhvil alıram','Evi yoxla','Ağ Şəhər · 2 otaq')+`<div class="card inspector-top"><p class="small muted">Hər otağın siyahısına baxın. Hər şey yerindədirsə bir düymə kifayətdir.</p><label for="inspector-name">Adınız</label><input id="inspector-name" value="${safe(inspectorName)}" autocomplete="name"><p class="help">Adın yazılması şəxsiyyət təsdiqi deyil.</p></div><div class="section-title"><h2>Otaqlar</h2><span class="small muted">${Object.keys(answers).length}/${rooms.length} cavab</span></div><div class="stack">${rooms.map(r=>{const a=answers[r.id];return `<section class="card room ${a?.type==='ok'?'selected-ok':a?'selected-problem':''}" data-room="${r.id}"><div class="row between"><h2>${r.name}</h2><span class="room-status">${a?(a.type==='ok'?'✓ Yoxlanıldı':a.type==='unable'?'Yoxlanılmadı':'Problem qeyd edilib'):'Gözləyir'}</span></div><ul class="room-list">${r.items.map(([n,q])=>`<li><span>${n}</span><span class="muted">${q}</span></li>`).join('')}</ul><div class="actions"><button class="${a?.type==='ok'?'primary':'secondary'}" data-room-ok="${r.id}" aria-pressed="${a?.type==='ok'}">✓ Hamısı qaydasındadır</button><button class="ghost" data-room-problem="${r.id}" aria-pressed="${a?.type==='problem'}">⚠ Problem var</button></div><button class="subtle-link" data-room-unable="${r.id}">Yoxlamaq mümkün olmadı</button>${a?.type==='problem'?`<div class="problem-fields"><label for="item-${r.id}">Hansı əşya?</label><select id="item-${r.id}" data-answer="${r.id}:item">${r.items.map(([n])=>`<option ${a.item===n?'selected':''}>${n}</option>`).join('')}</select><label for="condition-${r.id}">Problem</label><select id="condition-${r.id}" data-answer="${r.id}:condition"><option value="missing" ${a.condition==='missing'?'selected':''}>Çatışmır</option><option value="damaged" ${a.condition==='damaged'?'selected':''}>İşləmir / zədəlidir</option></select><label for="count-${r.id}">Faktiki say</label><input id="count-${r.id}" type="number" min="0" max="9999" value="${a.count??0}" data-answer="${r.id}:count"><label for="note-${r.id}">Qısa qeyd · istəyə bağlı</label><textarea id="note-${r.id}" maxlength="500" data-answer="${r.id}:note">${safe(a.note||'')}</textarea><button class="ghost full" data-action="photo-demo">Şəkil əlavə et · demo</button></div>`:a?.type==='unable'?`<label for="reason-${r.id}">Səbəb</label><input id="reason-${r.id}" data-answer="${r.id}:reason" maxlength="200" value="${safe(a.reason||'')}" placeholder="Məsələn, otaq bağlı idi">`:''}</section>`}).join('')}</div><p class="help" style="margin:18px 0">DEMO: cavablar yalnız səhifənin yaddaşındadır. Yenilədikdə silinir. Zərərə görə məbləğ avtomatik tutulmur.</p><div id="inspection-error" class="error-text" role="alert"></div><button class="primary full" data-action="complete-inspection">Yoxlamanı bitir</button>`}
    function publicPage(){return head('Nömrəsiz public təqdimat','Ağ Şəhərdə rahat ev','2 otaq · 4 qonaq · 2 yataq')+`<div class="card">${art()}<div class="row wrap" style="margin-top:16px"><span class="pill gray">Wi-Fi</span><span class="pill gray">İstilik</span><span class="pill gray">Kondisioner</span><span class="pill gray">Parkinq</span></div><p style="margin-top:16px">İşıqlı, sakit və rahat mənzil. Qısa qalmaq üçün lazım olan əsas imkanlar bir yerdədir.</p><div class="divider"></div><div class="row between"><div class="price">100 AZN <small>/ gecə</small></div><span class="small muted">Nümunə qiymət</span></div></div><div class="section-title"><h2>Uyğun tarixlər</h2></div><section class="card">${calendar(true)}<p class="help" style="margin-top:14px">Yaşıl tarixlər seçilə bilər. Digər günlərin səbəbi göstərilmir.</p><div id="public-selection" class="notice small" style="margin-top:14px">Giriş və çıxış tarixlərini seçin.</div><button class="primary full" style="margin-top:12px" data-action="copy-dates">Tarixləri kopyala</button></section><div class="card" style="margin-top:14px"><h2>Ev qaydaları</h2><p style="margin-top:10px">Giriş 15:00 · çıxış 12:00<br>Siqaret və tədbirə icazə verilmir.</p></div><p class="help" style="margin-top:18px">Tarix seçimi rezervasiya yaratmır. Razılaşmanı keçidi sizə göndərən şəxslə tamamlayın.</p>`}
    const guideText={az:{title:'Sauna',sub:'İstifadə təlimatı',intro:'Bu nümunə məzmun istifadə qaydasını deyil, təqdimat formasını göstərir.',steps:[['Təlimatı oxuyun','Avadanlığın modelinə uyğun sahib tərəfindən hazırlanmış qaydalar burada yerləşir.'],['Düyməni müəyyən edin','Şəkil və qısa izah uyğun idarəetmə düyməsini göstərir.'],['İstifadəni tamamlayın','Söndürmə və son yoxlama addımları burada göstərilir.']],warn:'Təhlükəsizlik məzmununu ev sahibi istehsalçı təlimatına uyğun hazırlamalıdır.',video:'Video izahı aç'},ru:{title:'Сауна',sub:'Инструкция',intro:'Образец показывает структуру страницы, а не реальные правила использования.',steps:[['Прочитайте инструкцию','Здесь владелец размещает правила для конкретной модели.'],['Найдите кнопку','Фотография и короткий текст показывают нужный элемент управления.'],['Завершите использование','Здесь размещаются выключение и последняя проверка.']],warn:'Правила безопасности готовит владелец по инструкции производителя.',video:'Открыть видео'},en:{title:'Sauna',sub:'House guide',intro:'This sample demonstrates the page layout, not actual operating instructions.',steps:[['Read the instructions','The owner provides instructions for the exact equipment model here.'],['Find the control','A photo and a short description identify the relevant control.'],['Finish safely','Shutdown and final checking steps are shown here.']],warn:'The owner must prepare safety content using the manufacturer’s instructions.',video:'Open video guide'}};
    function guide(){const t=guideText[lang];return `<div class="row between wrap"><span class="eyebrow">Ağ Şəhər · QR</span><div class="lang" aria-label="Təlimat dili">${['az','ru','en'].map(l=>`<button class="${l===lang?'active':''}" data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join('')}</div></div>`+head(t.sub,t.title,t.intro)+`<div class="notice warn">${t.warn}</div><section class="card" style="margin-top:16px">${t.steps.map(([title,txt],i)=>`<div class="guide-step"><span class="step-num">${i+1}</span><div><h2>${title}</h2><p class="muted small" style="margin-top:6px">${txt}</p></div></div>`).join('')}<div class="video-placeholder"><div><button data-action="video-demo">▶ ${t.video}</button><p class="help">Video faylı qoşulmayıb · demo</p></div></div></section><p class="help" style="margin-top:16px">Ümumi QR səhifəsi · qapı kodu və şəxsi giriş məlumatı yoxdur.</p>`}
    function editor(){return head('Ağ Şəhər','Təlimatlar','Mətn, şəkil və video — hazır bloklarla.')+`<div class="card"><label for="guide-title">Başlıq</label><input id="guide-title" value="Sauna"><label for="guide-type">Məzmunun görünməsi</label><select id="guide-type"><option>Ümumi / təhlükəsizlik — QR ilə açılır</option><option>Məxfi — yalnız qonaq keçidi</option></select><label for="guide-copy">Mətn bloku</label><textarea id="guide-copy">Avadanlığın modelinə uyğun təlimatı burada yazın.</textarea><div class="actions"><button class="ghost" data-action="media-demo">+ Şəkil</button><button class="ghost" data-action="video-demo">+ Video</button></div><div class="actions"><button class="secondary" data-action="language-demo">Dil əlavə et</button><button class="primary" data-go="guide">Önizlə</button></div><button class="ghost full" style="margin-top:10px" data-action="publish-demo">Dərc et · demo</button></div><p class="help">QR ünvanı məzmunu dəyişdikdə eyni qalır. Bu prototip QR faylı yaratmır.</p>`}
    function managers(){return head('Ev üzrə səlahiyyət','Menecerlər','Bir menecer müxtəlif sahiblərin evlərini idarə edə bilər.')+`<div class="card"><h2>Aysel · nümunə menecer</h2><p class="small muted" style="margin-top:6px">Ağ Şəhər · gündəlik idarəetmə</p><p class="help">Rezervasiya və həmin qonağın ödənişlərini görür. Ümumi mənfəət və bütün xərc hesabatını görmür.</p><button class="ghost" data-action="revoke-demo">Girişi ləğv et · demo</button></div><form class="card" style="margin-top:14px" id="invite-form"><label for="manager-email">Menecerin emaili</label><input id="manager-email" name="manager-email" type="email" autocomplete="email" required placeholder="ad@example.com"><label for="permission">Səlahiyyət</label><select id="permission"><option>Gündəlik idarəetmə</option><option>Tam idarəetmə</option></select><label class="check-row"><input type="checkbox" name="manager-property" checked><span>Ağ Şəhər · 2 otaq</span></label><button class="primary full" style="margin-top:12px">Dəvəti hazırla · demo</button></form>`}
    function billing(){return head('Yalnız Eve xidmət haqqı','Abunə','Kirayə ödənişləri bu bölmədən keçmir.')+`<section class="card"><div class="row between"><h2>Ağ Şəhər</h2><span class="pill">Aktiv</span></div><p class="help">10 dekabr 2026-dək</p><label for="plan">Plan</label><select id="plan"><option>Aylıq · 9,99 AZN / ev</option><option>İllik · 99,99 AZN / ev</option></select><div class="divider"></div><p class="small muted">Ödənişdən əvvəl yeni bitmə tarixi göstərilməlidir. Abunə yalnız server ödənişi təsdiqlədikdən sonra uzanır.</p><button class="primary full" style="margin-top:18px" data-action="pay-demo">Payriff ilə ödə · demo</button><p class="help">Bu düymə real checkout açmır və pul tutmur.</p></section><p class="help" style="margin-top:16px">İlk ev üçün 7 gün sınaq. Menecerə ayrıca abunə yoxdur.</p>`}
    function settings(){return head('Hesab və xidmət','Ayarlar','Profilinizi istədiyiniz vaxt tamamlayın.')+`<div class="card"><label for="profile-name">Adınız · istəyə bağlı</label><input id="profile-name" value="Rizvan"><label for="profile-phone">Telefon · istəyə bağlı</label><input id="profile-phone" type="tel" placeholder="+994"><button class="primary full" style="margin-top:16px" data-action="profile-demo">Dəyişikliyi göstər · demo</button></div><div class="card" style="margin-top:14px">${[['Menecerlər','managers'],['Abunə','billing'],['Təlimat redaktoru','editor'],['Giriş ekranı','login'],['Operator nümunəsi','operator']].map(([t,p])=>`<button class="list-btn" data-go="${p}"><span>${t}</span><span>›</span></button>`).join('')}<button class="list-btn" data-action="support-demo"><span>Kömək / problem bildir</span><span>›</span></button><button class="list-btn" data-action="logout-demo"><span>Çıxış et</span><span>↗</span></button><button class="list-btn danger" data-action="logout-all-demo"><span>Bütün cihazlardan çıxış</span><span>↗</span></button></div>`}
    function operator(){return head('Məhdud operator görünüşü','Dəstək nəzarəti','Bu ekran sahib panelinin hissəsi deyil.')+notice('Nümunə operator ekranı. Real hesab, qonaq məlumatı və provider açarı yoxdur.')+`<div class="card" style="margin-top:16px"><h2>Yoxlama gözləyən abunə</h2><p class="small muted">Nümunə sifariş · 9,99 AZN · pending</p><label for="operator-reason">Araşdırma səbəbi</label><textarea id="operator-reason" placeholder="Səbəb auditdə saxlanmalıdır"></textarea><button class="primary full" data-action="operator-demo">Statusu yoxla · demo</button><p class="help">Bu ekran abunəni özbaşına aktivləşdirmir.</p></div>`}
    function login(){return `<section class="auth"><div class="brand"><span class="brand-mark" aria-hidden="true">e</span>eve</div><div class="card"><h1>Evlərin bir yerdə.</h1><p class="muted" style="margin-top:12px">Emailinizi yazın. Giriş keçidini emailinizə göndərək.</p><form id="login-form"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="ad@example.com" required value="${safe(email)}"><button class="primary full" style="margin-top:18px">Email ilə davam et</button></form><p class="help" style="margin-top:16px">Şifrə yoxdur. İlk girişdə hesabınız yaradılır.</p></div><p class="help">DEMO: email göndərilmir. Yalnız ekran keçidi göstərilir.</p></section>`}
    function checkemail(){return `<section class="auth"><div class="card"><div class="icon" aria-hidden="true">✉</div><h1>Emailinizi yoxlayın</h1><p class="muted">Nümunə ünvan: <strong>${safe(email||'ad@example.com')}</strong></p><p class="help">Keçidi hansı cihazda açsanız, giriş həmin cihazda tamamlanır.</p><div class="actions"><button class="ghost" data-go="login">Emaili dəyiş</button><button class="secondary" data-action="resend-demo">Yenidən göndər · demo</button></div><button class="primary full" style="margin-top:20px" data-go="confirm">Nümunə email keçidini aç</button></div></section>`}
    function confirm(){return `<section class="auth"><div class="card"><h1>Girişinizi təsdiqləyin</h1><p class="muted">Bu əlavə toxunuş email proqramının keçidi əvvəlcədən açmasına qarşı nəzərdə tutulub.</p><button class="primary full" style="margin-top:20px" data-go="today">Eve-yə daxil ol · demo</button><p class="help">Real token yoxlanılmır və sessiya yaradılmır.</p></div></section>`}
    const views={today,calendar:calendarPage,properties,property,reservation,task:()=>task(false),worker:()=>task(true),inventory,inspection,public:publicPage,guide,editor,managers,billing,settings,operator,login,checkemail,confirm};
    function render(){renderNav();$('#screen-picker').value=page;const p=statePanel();$('#main').innerHTML=(viewState==='offline'?'<div class="notice warn" role="status" style="margin-bottom:18px">Bağlantı yoxdur. Son dəyişiklik hələ saxlanılmayıb. Bu, demo vəziyyətidir.</div>':'')+(p||views[page]());const guest=['login','checkemail','confirm','public','guide','inspection','worker'].includes(page);$('.shell').classList.toggle('guest',guest);$('.bottom-nav').classList.toggle('hidden',guest);$('#add-button').classList.toggle('hidden',guest||page==='operator');if(page==='public'&&viewState==='normal')updateDates()}
    function dialog(title,body){if($('#sheet').open)$('#sheet').close();$('#sheet-body').innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="Pəncərəni bağla">×</button></div>${body}`;$('#sheet').showModal()}
    function form(kind){const names={reservation:'Rezervasiya',money:'Pul al',refund:'Pul qaytar',expense:'Xərc',task:'Tapşırıq',cancel:'Rezervasiyanı ləğv et'};let fields='';if(kind==='reservation')fields=`<p class="help">Ağ Şəhər · ev artıq seçilib</p><div class="form-grid"><div><label for="checkin">Giriş</label><input id="checkin" name="checkin" type="date" value="2026-11-11" required></div><div><label for="checkout">Çıxış</label><input id="checkout" name="checkout" type="date" value="2026-11-14" required></div></div><label for="guest">Qonağın adı</label><input id="guest" name="guest" maxlength="120" required placeholder="Ad"><label for="phone">Telefon · istəyə bağlı</label><input id="phone" name="phone" type="tel" placeholder="+994"><div class="form-grid"><div><label for="total">Ümumi qiymət · AZN</label><input id="total" name="total" type="number" inputmode="decimal" min="0.01" step="0.01" value="300" required></div><div><label for="initial">Alınan pul · AZN</label><input id="initial" name="initial" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div></div><details><summary>Əlavə məlumat</summary><label for="realtor">Realtor</label><select id="realtor"><option>Yoxdur</option><option>Nümunə realtor</option></select><label for="reservation-note">Qeyd</label><textarea id="reservation-note" maxlength="1000"></textarea></details><label for="booking-mode">Tarixlər</label><select id="booking-mode"><option>Təsdiqlə</option><option>1 saat müvəqqəti saxla</option><option>3 saat müvəqqəti saxla</option></select>`;
      if(kind==='money'||kind==='refund')fields=`<p class="help">Ağ Şəhər · Raufun rezervasiyası</p><label for="amount">Məbləğ · AZN</label><input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" ${kind==='refund'?`max="${received}"`:''} required placeholder="0,00"><label for="money-kind">Növ</label><select id="money-kind" name="money-kind"><option value="rent">Kirayə ödənişi</option><option value="deposit">Təminat depoziti</option></select><label for="custodian">Pulu alan</label><select id="custodian"><option>Sahib / menecer</option><option>Realtor</option></select>${kind==='refund'?'<label for="original">Aid olduğu ödəniş</label><select id="original"><option>100 AZN · əvvəlki nümunə ödəniş</option></select>':''}<p class="help">Bu, pulun faktiki köçürülməsi deyil, uçot qeydidir.</p>`;
      if(kind==='expense')fields=`<p class="help">Ağ Şəhər · xərc evə bağlanır</p><label for="amount">Məbləğ · AZN</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required><label for="category">Kateqoriya</label><select id="category"><option>Kommunal</option><option>Usta / təmir</option><option>Təmizlik</option><option>Alış</option><option>Sərf materialı</option><option>Digər</option></select><details><summary>Əlavə məlumat</summary><label for="expense-note">Qeyd</label><textarea id="expense-note"></textarea><label class="check-row"><input type="checkbox" name="expense-paid"><span>Ödənilib</span></label><button class="ghost full" type="button" data-action="photo-demo">Çek şəkli · demo</button></details>`;
      if(kind==='task')fields=`<p class="help">Ağ Şəhər · ev hazır seçilib</p><label for="title">Görüləcək iş</label><input id="title" name="title" maxlength="160" required placeholder="Məsələn, kondisioneri yoxla"><label for="due">Vaxt</label><input id="due" name="due" type="datetime-local" value="2026-11-10T16:00" required><label for="assignee">İcraçı · istəyə bağlı</label><select id="assignee"><option>Hələ seçilməyib</option><option>Elçin · usta (nümunə)</option></select><label for="task-note">Qeyd · istəyə bağlı</label><textarea id="task-note"></textarea>`;
      if(kind==='cancel')fields=`<div class="notice warn small">Tarixlər açılacaq. Alınan pul avtomatik silinməyəcək və qaytarılmayacaq.</div><label for="retained">Saxlanılacaq kirayə məbləği · AZN</label><input id="retained" name="retained" type="number" min="0" step="0.01" value="0" required><p class="help">Qaytarma ayrıca orijinal ödənişə bağlı qeyd olunur.</p>`;
      dialog(names[kind],`<form id="demo-form" data-kind="${kind}">${fields}<div id="form-error" class="error-text" role="alert"></div><div class="form-actions"><button class="ghost" type="button" data-action="close">Geri</button><button class="primary" type="submit">${kind==='cancel'?'Ləğvi göstər':'Nəticəni göstər'} · demo</button></div><p class="help">Məlumat serverə yazılmır. Real ödəniş və göndəriş yoxdur.</p></form>`)}
    function updateDates(){const el=$('#public-selection');if(!el)return;if(publicDates.length<2){el.textContent=publicDates.length?`Giriş: ${publicDates[0]} noyabr. İndi çıxış tarixini seçin.`:'Giriş və çıxış tarixlərini seçin.';return}const [a,b]=publicDates;el.textContent=`${a}–${b} noyabr · ${b-a} gecə · ${(b-a)*100} AZN (nümunə)`}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.form){form(b.dataset.form);return}if(b.dataset.roomOk){answers[b.dataset.roomOk]={type:'ok'};render();return}if(b.dataset.roomProblem){const r=rooms.find(r=>r.id===b.dataset.roomProblem);answers[r.id]={type:'problem',item:r.items[0][0],condition:'missing',count:0,note:''};render();return}if(b.dataset.roomUnable){answers[b.dataset.roomUnable]={type:'unable',reason:''};render();return}if(b.dataset.lang){lang=b.dataset.lang;render();return}if(b.dataset.day){const d=Number(b.dataset.day);if(b.dataset.public==='true'){const available=[11,12,13,16,17,18,19,23,24,25,26,27,28];if(publicDates.length!==1)publicDates=[d];else{const a=publicDates[0];if(d<=a){publicDates=[d]}else if(Array.from({length:d-a},(_,i)=>a+i).every(n=>available.includes(n))){publicDates=[a,d]}else{announce('Yalnız ardıcıl uyğun gecələri seçin.');return}}render()}else form('reservation');return}const a=b.dataset.action;if(!a)return;if(a==='close'){$('#sheet').close();return}if(a==='restore'){viewState='normal';$('#state-picker').value='normal';render();return}if(a==='complete-inspection'){const name=$('#inspector-name').value.trim();const missing=rooms.filter(r=>!answers[r.id]);const invalidCount=rooms.some(r=>answers[r.id]?.type==='problem'&&(!Number.isInteger(Number(answers[r.id].count))||Number(answers[r.id].count)<0||Number(answers[r.id].count)>9999));const reasonMissing=rooms.some(r=>answers[r.id]?.type==='unable'&&!answers[r.id].reason?.trim());if(!name||missing.length||reasonMissing||invalidCount){$('#inspection-error').textContent=!name?'Adınızı yazın.':missing.length?'Hər otağa baxıb cavab seçin.':invalidCount?'Faktiki say 0–9999 arası tam ədəd olmalıdır.':'Yoxlanılmayan otaq üçün səbəbi yazın.';$('#inspection-error').scrollIntoView({block:'center'});return}inspectionDone=true;render();$('#main').focus();return}if(a==='restart-inspection'){answers={};inspectionDone=false;render();return}if(a==='copy-dates'){if(publicDates.length!==2){announce('Əvvəl giriş və çıxış tarixlərini seçin.');return}const text=`Ağ Şəhər · ${publicDates[0]}–${publicDates[1]} noyabr 2026 · ${publicDates[1]-publicDates[0]} gecə · DEMO`;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>announce('Nümunə tarix mətni kopyalandı. Rezervasiya yaranmadı.')).catch(()=>dialog('Tarixləri kopyalayın',`<p>${safe(text)}</p>`));else dialog('Tarixləri kopyalayın',`<p>${safe(text)}</p>`);return}if(a==='agenda'){go('today');return}if(a==='logout-demo'||a==='logout-all-demo'){announce('DEMO: real sessiya yoxdur. Giriş ekranı göstərilir.');go('login');return}if(a==='checkin'){bookingState=bookingState==='confirmed'?'checked_in':'completed';render();announce('DEMO: status yalnız səhifə yaddaşında dəyişdi. Server qeydi yoxdur.');return}if(a==='accept-task'){if(taskState!=='open')return;taskState='accepted';render();announce('DEMO: qəbul statusu göstərildi. Serverdə dəyişiklik yoxdur.');return}if(a==='report-task'){if(page==='worker'){if(taskState!=='accepted'){announce('Əvvəl işi qəbul edin.');return}taskState='reported_done'}else{if(taskState!=='reported_done'){announce('Əvvəl işçinin görünüşündə işi qəbul edib tamamlandığını bildirin.');return}taskState='completed'}render();announce('DEMO: vəziyyət yalnız səhifə yaddaşında dəyişdi.');return}const messages={'checkin':'DEMO: giriş vəziyyətinin dəyişməsi göstərilir. Server qeydi yaranmadı.','guest-share':'DEMO: məxfi qonaq keçidi real sistemdə müddətli olmalıdır. Burada keçid yaradılmır.','whatsapp':'DEMO: real WhatsApp açılmadı, mesaj göndərilmədi. İcraçı görünüşünü açıb axını yoxlaya bilərsiniz.','accept-task':'DEMO: qəbul düyməsinə toxunuş göstərildi. Serverdə task statusu dəyişmədi.','report-task':'DEMO: işin bildirilməsi ilə sahibin təsdiqi ayrı addımlardır. Real qeyd yoxdur.','template':'DEMO: aşağıda hazır otaq və əşya şablonu göstərilir.','copy-inventory':'DEMO: yalnız icazə verilmiş mənbə evin inventarı kopyalana bilər.','photo-demo':'DEMO: real kamera və fayl yükləməsi qoşulmayıb.','video-demo':'DEMO: video faylı və real player qoşulmayıb.','media-demo':'DEMO: media yükləməsi bu prototipə daxil deyil.','language-demo':'DEMO: AZ/RU/EN nəticəni QR təlimatı ekranında yoxlayın.','publish-demo':'DEMO: məzmun yayımlanmadı. QR ünvanının sabit qalması sənəddə göstərilib.','revoke-demo':'DEMO: real membership yoxdur. İstehsalda ləğv növbəti server sorğusuna tətbiq edilir.','pay-demo':'DEMO: Payriff checkout qoşulmayıb. Heç bir pul tutulmadı.','profile-demo':'DEMO: profil dəyişikliyi serverə yazılmadı.','support-demo':'DEMO: dəstək müraciəti yaradılmadı.','operator-demo':'DEMO: provider status sorğusu və audit backend-i yoxdur.','resend-demo':'DEMO: email göndərilmir; real sistemdə 60 saniyəlik təkrar göndərmə gözləməsi var.'};announce(messages[a]||'Nümunə əməliyyat. Real məlumat dəyişmir.')});
    document.addEventListener('input',e=>{if(e.target.id==='inspector-name'){inspectorName=e.target.value;return}if(!e.target.dataset.answer)return;const [r,k]=e.target.dataset.answer.split(':');if(answers[r])answers[r][k]=e.target.value});
    document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();email=$('#email').value.trim();go('checkemail');return}if(e.target.id==='invite-form'){e.preventDefault();announce('DEMO: dəvət məlumatı yoxlanıldı. Email göndərilmədi.');return}if(e.target.id!=='demo-form')return;e.preventDefault();const kind=e.target.dataset.kind;const data=new FormData(e.target);if(viewState==='offline'){$('#form-error').textContent='Bağlantı yoxdur. Məlumat saxlanılmayıb.';return}if(kind==='reservation'&&data.get('checkout')<=data.get('checkin')){$('#form-error').textContent='Çıxış giriş tarixindən sonra olmalıdır.';return}if(kind==='money'&&data.get('money-kind')==='rent')received+=Number(data.get('amount'));if(kind==='refund'&&data.get('money-kind')==='rent')received-=Number(data.get('amount'));$('#sheet').close();render();announce('DEMO: nümunə nəticə göstərildi. Serverə heç nə yazılmadı.')});
    $('#add-button').addEventListener('click',()=>dialog('Nə əlavə edək?',`<p class="help">${['property','reservation','inventory'].includes(page)?'Ağ Şəhər artıq seçilib.':'Real sistemdə əvvəl aid olduğu ev seçilir.'}</p><div class="stack" style="margin-top:18px"><button class="primary" data-form="reservation">Rezervasiya</button><button class="secondary" data-form="money">Pul qeydi</button><button class="secondary" data-form="expense">Xərc</button><button class="secondary" data-form="task">Tapşırıq</button></div>`));
    $('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))$('#sheet').close()});
    $('#screen-picker').innerHTML=screens.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');$('#screen-picker').addEventListener('change',e=>go(e.target.value));$('#state-picker').addEventListener('change',e=>{viewState=e.target.value;render()});$('#reset-demo').addEventListener('click',()=>{answers={};inspectionDone=false;publicDates=[];received=100;email='';lang='az';inspectorName='Səbinə';bookingState='confirmed';taskState='open';go('today');announce('Demo sıfırlandı. Real məlumat yoxdur.')});render();
  </script>
