name: Sənədlərin bütövlüyü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository-ni aç
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Sənəd linkləri və tələb ID-ləri
        run: node scripts/docs-check.mjs
