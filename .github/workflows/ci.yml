      - name: Expense proposal and allocation migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261118003400_eve_expense_proposal_allocation.sql
      - name: Expense allocation, scope, and replay smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0075_expense_proposal_allocation_smoke.sql
      - name: Task link and scoped expense migrations
