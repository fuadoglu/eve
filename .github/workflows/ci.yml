          PGUSER: postgres
          PGPASSWORD: local_schema_test_only
          PGDATABASE: eve_schema_test
        run: python3 scripts/test-db-concurrency.py

  supabase_local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository-ni aç
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: pnpm quraşdır
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.18.0
          run_install: false
      - name: Node.js versiyasını seç
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Təzə sintetik Supabase stack-i qur
        run: |
          if ! npx -y supabase@3.1.0 start \
            -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > /tmp/eve-local-stack.log 2>&1; then
            echo 'Local Supabase startup failed; applied migration names follow.'
            sed -nE 's/^Applying migration ([0-9]{14}_[A-Za-z0-9_]+[.]sql)[.][.][.]$/\1/p' \
              /tmp/eve-local-stack.log
            grep -Ei -A6 'ERROR:|FATAL:|failed|permission denied|does not exist|must be owner' \
              /tmp/eve-local-stack.log | tail -n 20 || true
            exit 1
          fi
          sed -nE 's/^Applying migration ([0-9]{14}_[A-Za-z0-9_]+[.]sql)[.][.][.]$/\1/p' \
            /tmp/eve-local-stack.log
      - name: Supabase RPC, RLS və sintetik rent fixture smoke
        run: |
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_property_create_trial_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_inventory_media_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_inventory_foundation_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_manager_invite_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_api_surface_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0066_reservation_placement_history_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0067_reservation_move_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0068_today_projection_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0068_reservation_at10_transition_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_session_revocation_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_rls_coverage_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_rent_read_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0063_expired_hold_catchup_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0064_reservation_create_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0250_reservation_create_read_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0221_upload_quota_reservation_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0222_media_finalize_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0222_media_access_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0240_billing_period_apply_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
