      - name: Realtor settlement tenant, version, idempotency and no-double-income smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0072_realtor_settlement_smoke.sql
      - name: Inventory copy/import migration
