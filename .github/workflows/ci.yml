            < supabase/tests/0075_expense_proposal_allocation_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0074_task_link_http_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0073_inventory_copy_import_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_rls_coverage_smoke.sql
          docker exec -i supabase_db_eve psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/0062_api_surface_smoke.sql
      - name: Data API və Storage mənfi HTTP sınağı
        run: python3 scripts/test-local-supabase-http.py
      - name: Browser və route inteqrasiyası üçün app dependency-ləri
        run: |
          eval "$(npx -y supabase@3.1.0 status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Cookie-scoped browser-to-PostgreSQL reservation E2E
        run: |
          eval "$(npx -y supabase@3.1.0 status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          EVE_LOCAL_TEST_ALLOW_HTTP=1 node scripts/test-reservation-route-http.mjs
      - name: Lokal sintetik stack-i sil
        if: always()
        run: npx -y supabase@3.1.0 stop --project-id eve --no-backup
