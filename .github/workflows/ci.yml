name: CI

on:
  push:
    branches: [main, 'feat/EVE-005-*']
  pull_request:
    branches: [main, 'feat/EVE-005-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository-ni aç
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: pnpm quraşdır
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.18.0
          run_install: false
      - name: Node.js versiyasını seç
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: pnpm quraşdır
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.18.0
          run_install: false
      - name: Python versiyasını seç
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - name: Lockfile-dan dependency-ləri quraşdır
        run: pnpm install --frozen-lockfile
      - name: Env kontraktını yoxla
        run: pnpm test:env
      - name: Email passwordless axın unit sınaqları
        run: pnpm test:identity
      - name: Manager invite token unit sınaqları
        run: pnpm test:access
      - name: Reservation input/DTO unit sınaqları
        run: pnpm test:reservations
      - name: Task transition contract unit sınaqları
        run: pnpm test:operations
      - name: Media upload bytes validation unit sınaqları
        run: pnpm test:media
      - name: Billing catalog və order-line unit sınaqları
        run: pnpm test:billing
      - name: Rent/deposit ledger contract unit sınaqları
        run: pnpm test:finance
      - name: Today projection contract unit sınaqları
        run: pnpm test:today
      - name: Inventory parser və contract unit sınaqları
        run: pnpm test:inventory
      - name: TypeScript yoxlaması
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Chromium quraşdır
        run: pnpm exec playwright install --with-deps chromium
      - name: Mobil shell brauzer sınağı
        run: |
          pnpm start --port 4177 > /tmp/eve-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:4177/today > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:ui
      - name: Sənəd linkləri və tələb ID-ləri
        run: node scripts/docs-check.mjs
      - name: Kontraktlar və asılılıq qrafı
        run: node scripts/verify-contracts.mjs
      - name: Supabase API və Storage config müqaviləsi
        run: python scripts/verify-storage-config.py
      - name: Python validator mühiti
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-docs.txt
      - name: OpenAPI və JSON Schema nümunələri
        run: .venv-docs/bin/python scripts/validate-schemas.py
      - name: Prototipin davranış smoke yoxlaması
        run: node scripts/test-prototype.mjs

  sql_schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: local_schema_test_only
          POSTGRES_DB: eve_schema_test
        options: >-
          --health-cmd "pg_isready -U postgres -d eve_schema_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Repository-ni aç
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lokal auth stub və client rollarını yarat
        run: |
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email varchar(254),
            email_confirmed_at timestamptz
          );
          create table auth.sessions (id uuid primary key, user_id uuid not null, created_at timestamptz not null default now());
          alter table auth.sessions enable row level security;
          create function auth.uid() returns uuid language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          grant usage on schema auth to anon, authenticated;
          grant select on auth.sessions to anon, authenticated;
          SQL
      - name: SQL migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000100_eve_core_schema.sql
      - name: Tenant və constraint smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0061_core_schema_smoke.sql
      - name: RLS və RPC migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000200_eve_access_policies.sql
      - name: Role-switched giriş smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_access_policy_smoke.sql
      - name: Storage test stub və permissive baseline
        run: |
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 <<'SQL'
          create schema storage;
          create table storage.buckets (id text primary key, public boolean not null);
          create table storage.objects (id uuid primary key, bucket_id text not null, name text not null);
          alter table storage.objects enable row level security;
          grant usage on schema storage to anon, authenticated;
          grant select, insert on storage.objects to anon, authenticated;
          create policy deliberately_permissive on storage.objects
            for all to anon, authenticated using (true) with check (true);
          insert into storage.buckets(id,public) values
            ('eve-public-property',false), ('eve-public-guide',false),
            ('eve-private-guest',false), ('eve-private-receipt',false),
            ('eve-private-inspection',false), ('eve-private-task',false),
            ('eve-private-inventory',false), ('eve-private-import',false),
            ('unrelated-bucket',false);
          SQL
      - name: Storage boundary migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000300_eve_storage_boundary.sql
      - name: Storage bucket və policy smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_storage_boundary_smoke.sql
      - name: Cari rezervasiya read migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000400_eve_reservation_read.sql
      - name: Placement-scoped rezervasiya read smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_reservation_read_smoke.sql
      - name: Property list read migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000500_eve_property_list_read.sql
      - name: Owner və menecer property list smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_property_list_smoke.sql
      - name: Son cədvəl limit xətasında migration atomikliyi
        run: |
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into app_private.push_subscriptions(user_id,endpoint,p256dh,auth_key)
          values ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',
                  'https://example.invalid/atomicity','synthetic',repeat('x',129));
          SQL
          set +e
          output=$(docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000600_eve_api_length_alignment.sql 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || ! grep -q 'value too long for type character varying(128)' <<< "$output"; then
            echo "$output"
            echo 'Expected late-table varchar failure was not observed'
            exit 1
          fi
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select atttypmod-4 from pg_attribute
                where attrelid='app_private.profiles'::regclass and attname='display_name') <> 120
               or (select atttypmod-4 from pg_attribute
                where attrelid='app_private.push_subscriptions'::regclass and attname='auth_key') <> 255 then
              raise exception 'failed migration left earlier column changes behind';
            end if;
          end $$;
          delete from app_private.push_subscriptions
            where endpoint='https://example.invalid/atomicity';
          SQL
      - name: API və DB string limit migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000600_eve_api_length_alignment.sql
      - name: API və DB string limit smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_api_length_smoke.sql
      - name: Cari rezervasiya list migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000700_eve_reservation_list_read.sql
      - name: Cari rezervasiya list isolation smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_reservation_list_smoke.sql
      - name: Private təqvim blok oxu migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000800_eve_manual_block_read.sql
      - name: Private blok səbəbi və tenant isolation smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_manual_block_read_smoke.sql
      - name: Son enum xətasında migration atomikliyi
        run: |
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into app_private.support_requests(id,user_id,category,message)
          values ('e5000000-0000-0000-0000-000000000001',
                  'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','invalid','Synthetic migration guard');
          SQL
          set +e
          output=$(docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000900_eve_api_enum_alignment.sql 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || ! grep -q 'support_requests_category_allowed' <<< "$output"; then
            echo "$output"
            echo 'Expected final-table enum failure was not observed'
            exit 1
          fi
          docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if exists (select 1 from pg_constraint
                where conrelid='app_private.contacts'::regclass
                  and conname='contacts_service_type_allowed')
               or coalesce((select pg_get_expr(d.adbin,d.adrelid)
                   from pg_attrdef d join pg_attribute a
                     on a.attrelid=d.adrelid and a.attnum=d.adnum
                   where d.adrelid='app_private.inventory_items'::regclass
                     and a.attname='unit'),'') not like '%ədəd%' then
              raise exception 'failed enum migration left earlier changes behind';
            end if;
          end $$;
          delete from app_private.support_requests
            where id='e5000000-0000-0000-0000-000000000001';
          SQL
      - name: API enum və default migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111000900_eve_api_enum_alignment.sql
      - name: API enum və default smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_api_enum_smoke.sql
      - name: Scoped kontakt oxu migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111001000_eve_contact_read.sql
      - name: Kontakt private note və tenant isolation smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_contact_read_smoke.sql
      - name: Rezervasiya pul tarixçəsi oxu migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261111001100_eve_rent_read.sql
      - name: Cari və tarixi pul qeydi isolation smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_rent_read_smoke.sql
      - name: Session revocation migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001200_eve_session_revocation.sql
      - name: Session refresh və logout-all scope smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_session_revocation_smoke.sql
      - name: Property create və first-trial migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001300_eve_property_create_trial.sql
      - name: Ev yaradılması, trial və owner scope smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_property_create_trial_smoke.sql
      - name: Şəxsi inventar media enum migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001400_eve_private_inventory_enum.sql
      - name: Şəxsi inventar bucket və Storage deny migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001500_eve_private_inventory_bucket.sql
      - name: Şəxsi inventar bucket/Storage sərhədi smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_inventory_media_smoke.sql
      - name: Inventar otaq/əşya/şablon migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001600_eve_inventory_foundation.sql
      - name: Inventar DTO, entitlement və tenant isolation smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_inventory_foundation_smoke.sql
      - name: Manager invite və property permission migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001700_eve_manager_invites.sql
      - name: Email-match, expiry, replay və tenant isolation invite smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0062_manager_invite_smoke.sql
      - name: Expired hold catch-up migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001800_eve_expired_hold_catchup.sql
      - name: Expired hold catch-up atomiklik və scope smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0063_expired_hold_catchup_smoke.sql
      - name: Reservation create və initial receipt migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261113001900_eve_reservation_create.sql
      - name: Rezervasiya create, receipt və idempotency DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0064_reservation_create_smoke.sql
      - name: Task keçid tarixçəsi migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261114002000_eve_task_transition_history.sql
      - name: Task state, tenant, idempotency və media smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0065_task_transition_history_smoke.sql
      - name: Upload intent/quota reservation migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261114002100_eve_upload_quota_reservation.sql
      - name: Upload reservation, idempotency, quota və scope DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0221_upload_quota_reservation_smoke.sql
      - name: Media MIME finalize migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261114002200_eve_media_finalize.sql
      - name: Media finalize authorization və idempotency DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0222_media_finalize_smoke.sql
      - name: Media access proxy və scoped link migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261114002300_eve_media_read_proxy.sql
      - name: Media authorization, link expiry və source bridge DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0222_media_access_smoke.sql
      - name: Verified billing order period migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261115002400_eve_billing_period_apply.sql
      - name: Trial, leap, retry və billing entitlement DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0240_billing_period_apply_smoke.sql
      - name: Reservation create DTO və property context migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261115002500_eve_reservation_create_read.sql
      - name: Reservation DTO balance və idempotent retry DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0250_reservation_create_read_smoke.sql
      - name: Reservation placement history guard migration tətbiq et
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261116002600_eve_reservation_placement_history_guard.sql
      - name: Placement history və current-placement permission DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0066_reservation_placement_history_smoke.sql
      - name: Reservation property move migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261116002700_eve_reservation_move.sql
      - name: Reservation property move authorization və transaction smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0067_reservation_move_smoke.sql
      - name: Today read-only projection migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261116002800_eve_today_projection.sql
      - name: Today projection priority, ledger və property scope smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0068_today_projection_smoke.sql
      - name: Reservation date/price and lifecycle migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261117002800_eve_reservation_at10_transitions.sql
      - name: Reservation AT10 lifecycle and financial decision DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0068_reservation_at10_transition_smoke.sql
      - name: Calendar read-only projection migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261117002900_eve_calendar_projection.sql
      - name: Calendar range, property scope and GET purity smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0069_calendar_projection_smoke.sql
      - name: Rent/deposit/refund append-only ledger migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261117003000_eve_rent_ledger_commands.sql
      - name: Rent ledger authorization, replay and balance DB smoke
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/tests/0071_rent_ledger_commands_smoke.sql
      - name: Verified billing event inbox migration
        run: docker exec -i '${{ job.services.postgres.id }}' psql -U postgres -d eve_schema_test -v ON_ERROR_STOP=1 < supabase/migrations/20261117003100_eve_verified_billing_event.sql
      - name: Verified inbox dedupe, reconciliation and entitlement DB smoke
